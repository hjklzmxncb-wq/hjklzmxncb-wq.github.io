<div class="search-layer" id="searchLayer" hidden><div class="search-panel"><div class="search-head"><input id="searchInput" placeholder="작품, 장르, 인물, 챕터 검색…"><button class="icon-btn" id="searchClose">×</button></div><div class="genre-chips" id="searchGenres"></div><div id="searchResults" class="search-results"></div></div></div>

<div class="modal-layer" id="authLayer" hidden><div class="modal-card auth-card"><button class="modal-x" id="authClose" type="button" aria-label="닫기">×</button><span class="eyebrow">MEMBERSHIP</span><h2 id="authTitle">로그인</h2><p class="modal-sub" id="authSubtitle">한 번 로그인하면 로그아웃하기 전까지 이 브라우저에서 자동 로그인됩니다.</p><form id="authForm"><label id="authEmailLabel">이메일<input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label><label id="authPasswordLabel"><span id="authPasswordLabelText">비밀번호</span><div class="password-field"><input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상"><button type="button" class="password-toggle" id="passwordToggle">보기</button></div></label><div class="auth-options" id="authOptions"><label class="remember-check"><input id="rememberEmail" type="checkbox"> 이메일 기억</label><button type="button" class="inline-link" id="forgotPassword">비밀번호 찾기</button></div><button class="primary-btn full" type="submit" id="authSubmit">로그인</button></form><div class="auth-divider" id="authDivider"><span>또는</span></div><div class="social-login" id="socialLogin"><button type="button" class="social-btn" id="googleLogin"><b>G</b> Google로 계속</button><button type="button" class="social-btn" id="githubLogin"><b>GH</b> GitHub로 계속</button></div><button class="text-btn" id="authToggle" type="button">처음이신가요? 회원가입</button><p class="session-note" id="sessionNote">비밀번호는 저장하지 않습니다. 로그인 세션만 안전하게 유지합니다.</p><div class="setup-note" id="authSetupNote" hidden>Supabase 설정을 연결하면 실제 회원가입/로그인이 활성화됩니다.</div></div></div>

<aside class="reader-panel" id="readerPanel" hidden><div class="panel-head"><strong>읽기 설정</strong><button class="icon-btn" id="panelClose">×</button></div><label>글자 크기 <output id="fontSizeOut"></output><input id="fontSize" type="range" min="16" max="27" step="1"></label><label>줄 간격 <output id="lineHeightOut"></output><input id="lineHeight" type="range" min="1.5" max="2.25" step="0.05"></label><label>본문 폭 <output id="widthOut"></output><input id="readerWidth" type="range" min="620" max="920" step="20"></label><div class="segmented" id="fontMode"><button data-font="serif">명조</button><button data-font="sans">고딕</button></div><button class="secondary-btn full" id="themeBtn">라이트 / 다크</button></aside>

<div id="toast" class="toast" hidden></div>
